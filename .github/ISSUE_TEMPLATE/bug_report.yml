name: Bug report
description: Something broken in PROTO Android client
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve **PROTO**. Please search existing issues first.
        This repo is **client source only** — backend/server bugs may need proto.su support.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open app
        2. Go to ...
        3. Tap ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PROTO version
      placeholder: "1.1.1"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device & Android version
      placeholder: "Pixel 8, Android 15"
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Contribution intent
      options:
        - label: I am reporting this to improve official PROTO (not a fork product)
          required: true
